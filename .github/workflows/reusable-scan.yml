# TrustScan Security Scan: the workflow connected repositories' stubs call.
#
# Every run is approved by TrustScan before anything runs. The stub passes the
# scan's job id and a one-time ticket; the first job proves to TrustScan, with
# GitHub's OIDC token for this run, that it is this workflow at its released
# tag, started by a dispatch, on a GitHub-hosted runner, in the ticket's
# repository. TrustScan answers with the scan's plan (engines, commit). A run
# TrustScan did not start gets no plan and stops here.
#
# The engines run from the TrustScan engine image. TrustScan's own code in it
# is encrypted; the scan job asks TrustScan for the key and passes it to the
# image on stdin. Results are sealed to TrustScan's key inside the image before
# upload: only TrustScan can read them.

name: TrustScan Reusable Scanner

on:
  workflow_call:
    inputs:
      job_id:
        description: 'Scan job ID (set by TrustScan)'
        required: true
        type: string
      ticket:
        description: 'One-time scan ticket (set by TrustScan)'
        required: true
        type: string
      engine_tag:
        description: 'Engine image tag'
        required: false
        type: string
        default: 'v2'   # release-pinned: scripts/release-scan-engine.sh sets the release tag
      resolver_tag:
        description: 'Resolver image tag (dependency resolution)'
        required: false
        type: string
        default: 'v2'   # release-pinned: scripts/release-scan-engine.sh sets the release tag

env:
  JOB_ID: ${{ inputs.job_id }}
  TRUSTSCAN_API: https://trustscan.sc.deeptrustxai.com
  OIDC_AUDIENCE: trustscan-engine
  REG: ghcr.io/cs14lab
  # The public half of the key TrustScan's images are signed with: an image
  # runs only if its signature verifies. Empty: no check.
  IMAGE_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEjrd3dwO76+VBphmiHujzwvmuv543
    7iuutndNiAvA+LhpxuIAUP6EESOszSoLX0iI84sZ06or2Tni//+Tmz1pFw==
    -----END PUBLIC KEY-----

jobs:
  # ── Approval: TrustScan checks the run and returns the plan ──
  gate:
    name: Prepare scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    outputs:
      engines: ${{ steps.plan.outputs.engines }}
      in_image: ${{ steps.plan.outputs.in_image }}
      ts_e2: ${{ steps.plan.outputs.ts_e2 }}
      dep_resolve: ${{ steps.plan.outputs.dep_resolve }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - name: Ask TrustScan to approve this run
        id: plan
        env:
          TICKET: ${{ inputs.ticket }}
        run: |
          echo "::add-mask::$TICKET"
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -r .value)
          echo "::add-mask::$token"
          body=$(jq -nc --arg j "$JOB_ID" --arg t "$TICKET" '{job_id: $j, ticket: $t}')
          code=$(curl -sS -o plan.json -w '%{http_code}' -X POST "$TRUSTSCAN_API/api/engine/redeem" \
                   -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$body")
          if [ "$code" != 200 ]; then
            echo "::error::$(jq -r '.detail // "TrustScan did not approve this run."' plan.json 2>/dev/null || echo 'TrustScan could not be reached.')"
            exit 1
          fi
          engines=$(jq -r '.engines | join(",")' plan.json)
          commit=$(jq -r '.commit' plan.json)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::TrustScan's plan has no commit"; exit 1; }
          has() { [[ ",$engines," == *",$1,"* ]] && echo true || echo false; }
          {
            echo "engines=$engines"
            echo "in_image=$(jq -r '[.engines[] | select(test("^ts-e[134567]$"))] | join(",")' plan.json)"
            echo "ts_e2=$(has ts-e2)"
            echo "dep_resolve=$(has dep-resolve)"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
          echo "Approved. Engines: $engines. Commit: $commit."

  # ── The engines ─────────────────────────────────────
  scan:
    name: Scan
    needs: gate
    if: needs.gate.outputs.in_image != '' || needs.gate.outputs.ts_e2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.commit }}
          path: src
          persist-credentials: false

      - name: Install signature verifier
        if: env.IMAGE_PUBLIC_KEY != ''
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Engine image
        env:
          TAG: ${{ inputs.engine_tag }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad image tag"; exit 1; }
          # Pulled, pinned to the digest that was pulled, and (when a key is
          # set) verified before anything in it runs.
          docker pull -q "$REG/trustscan-engine:$TAG" >/dev/null
          ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$REG/trustscan-engine:$TAG")
          [[ "$ref" == "$REG/trustscan-engine@sha256:"* ]] || { echo "::error::no digest for the engine image"; exit 1; }
          if [ -n "$IMAGE_PUBLIC_KEY" ]; then
            printf '%s\n' "$IMAGE_PUBLIC_KEY" > "$RUNNER_TEMP/image.pub"
            cosign verify --key "$RUNNER_TEMP/image.pub" "$ref" >/dev/null 2>&1 \
              || { echo "::error::The engine image's signature could not be verified; it was not run."; exit 1; }
            echo "Engine image signature verified."
          fi
          echo "ENGINE=$ref" >> "$GITHUB_ENV"

      - name: Analyse
        env:
          TICKET: ${{ inputs.ticket }}
          IN_IMAGE: ${{ needs.gate.outputs.in_image }}
          TS_E2: ${{ needs.gate.outputs.ts_e2 }}
        run: |
          echo "::add-mask::$TICKET"
          mkdir -p out
          # The key for this image's payload, from TrustScan, for this run
          # only. It stays in this step's memory and reaches the image on stdin.
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -r .value)
          echo "::add-mask::$token"
          payload=$(docker run --rm "$ENGINE" id)
          body=$(jq -nc --arg j "$JOB_ID" --arg t "$TICKET" --arg p "$payload" '{job_id: $j, ticket: $t, payload_id: $p}')
          key=$(curl -sSf -X POST "$TRUSTSCAN_API/api/engine/redeem" -H "Authorization: Bearer $token" \
                  -H 'Content-Type: application/json' -d "$body" | jq -r '.key // empty' || true)
          [ -n "$key" ] || { echo "::error::TrustScan did not release the engine for this run."; exit 1; }
          echo "::add-mask::$key"
          if [ -n "$IN_IMAGE" ]; then
            jq -nc --arg k "$key" --arg e "$IN_IMAGE" '{key: $k, engines: ($e | split(","))}' \
              | docker run -i --rm -v "$PWD/src:/src:ro" -v "$PWD/out:/out" "$ENGINE" run
          fi
          if [ "$TS_E2" = true ]; then
            jq -nc --arg k "$key" '{key: $k}' | docker run -i --rm "$ENGINE" script ts-e2 > "$RUNNER_TEMP/ts-e2.sh"
            bash "$RUNNER_TEMP/ts-e2.sh" "$PWD/src" "$PWD/out" "$ENGINE"
            rm -f "$RUNNER_TEMP/ts-e2.sh"
          fi
          unset key token

      # One artifact per engine, named by engine id: TrustScan reads each one.
      - { name: Upload ts-e1, if: hashFiles('out/ts-e1.sealed') != '', uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9, with: { name: "ts-e1-results-${{ env.JOB_ID }}", path: out/ts-e1.sealed } }
      - { name: Upload ts-e2, if: hashFiles('out/ts-e2.sealed') != '', uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9, with: { name: "ts-e2-results-${{ env.JOB_ID }}", path: out/ts-e2.sealed } }
      - { name: Upload ts-e3, if: hashFiles('out/ts-e3.sealed') != '', uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9, with: { name: "ts-e3-results-${{ env.JOB_ID }}", path: out/ts-e3.sealed } }
      - { name: Upload ts-e4, if: hashFiles('out/ts-e4.sealed') != '', uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9, with: { name: "ts-e4-results-${{ env.JOB_ID }}", path: out/ts-e4.sealed } }
      - { name: Upload ts-e5, if: hashFiles('out/ts-e5.sealed') != '', uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9, with: { name: "ts-e5-results-${{ env.JOB_ID }}", path: out/ts-e5.sealed } }
      - { name: Upload ts-e6, if: hashFiles('out/ts-e6.sealed') != '', uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9, with: { name: "ts-e6-sbom-${{ env.JOB_ID }}", path: out/ts-e6.sealed } }
      - { name: Upload ts-e7, if: hashFiles('out/ts-e7.sealed') != '', uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9, with: { name: "ts-e7-results-${{ env.JOB_ID }}", path: out/ts-e7.sealed } }

  # ── Dependency resolution for supply chain analysis ─
  # It may run the project's own build code (Gradle, setup.py, source-only
  # packages), so it is a job of its own, never given the engine's key, with
  # no token and no network but the package registries (the resolver's run.sh).
  dep-resolve:
    name: Dependency resolution
    needs: gate
    if: needs.gate.outputs.dep_resolve == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.resolver_tag }}
      ENGINE_TAG: ${{ inputs.engine_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.commit }}
          path: src
          persist-credentials: false

      - name: Install signature verifier
        if: env.IMAGE_PUBLIC_KEY != ''
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Resolve
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ && "$ENGINE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad image tag"; exit 1; }
          if [ -n "$IMAGE_PUBLIC_KEY" ]; then printf '%s\n' "$IMAGE_PUBLIC_KEY" > "$RUNNER_TEMP/image.pub"; fi
          # Each image is pulled, pinned to the digest that was pulled, and
          # (when a key is set) verified before anything in it runs.
          pinned() {
            docker pull -q "$REG/$1:$2" >/dev/null
            local ref
            ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$REG/$1:$2")
            [[ "$ref" == "$REG/$1@sha256:"* ]] || { echo "::error::no digest for $1" >&2; exit 1; }
            if [ -n "$IMAGE_PUBLIC_KEY" ]; then
              cosign verify --key "$RUNNER_TEMP/image.pub" "$ref" >/dev/null 2>&1 \
                || { echo "::error::The signature of $1 could not be verified; it was not run." >&2; exit 1; }
            fi
            echo "$ref"
          }
          RESOLVER_IMAGE=$(pinned trustscan-dep-resolver "$TAG")
          RESOLVER_BUILD_IMAGE=$(pinned trustscan-dep-resolver-build "$TAG")
          EGRESS_IMAGE=$(pinned trustscan-resolver-egress "$TAG")
          EGRESS_BUILD_IMAGE=$(pinned trustscan-resolver-egress-build "$TAG")
          ENGINE=$(pinned trustscan-engine "$ENGINE_TAG")
          export RESOLVER_IMAGE RESOLVER_BUILD_IMAGE EGRESS_IMAGE EGRESS_BUILD_IMAGE
          docker run --rm --entrypoint cat "$RESOLVER_IMAGE" /opt/resolver/ci/run.sh > run.sh
          bash run.sh src out --build-mode
          # Sealed for TrustScan, like every other result.
          mkdir -p sealed
          docker run --rm -v "$PWD/out:/in:ro" -v "$PWD/sealed:/sealed" "$ENGINE" \
            seal dep-resolve /sealed /in/resolved-deps.json /in/meta.json

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dep-resolution-${{ env.JOB_ID }}
          path: sealed/dep-resolve.sealed
          retention-days: 7

  # ── Summary ─────────────────────────────────────────
  summary:
    name: Scan summary
    needs: [gate, scan, dep-resolve]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create summary
        env:
          ENGINES: ${{ needs.gate.outputs.engines }}
          GATE: ${{ needs.gate.result }}
          SCAN: ${{ needs.scan.result }}
        run: |
          {
            echo "## 🔐 TrustScan Security Scan"
            echo ""
            echo "**Job ID:** ${JOB_ID}"
            if [ "$GATE" != success ]; then
              echo ""
              echo "This run was not approved by TrustScan. Start scans from the TrustScan dashboard."
            else
              echo "**Engines:** ${ENGINES}"
              echo ""
              echo "Scan: ${SCAN}. Results are sealed for TrustScan; open the scan in the dashboard."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
