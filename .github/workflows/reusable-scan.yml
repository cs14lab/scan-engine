# TrustScan Reusable Security Scanner
# Called by lightweight stubs in user repositories via workflow_call.
# All scan logic lives here — stubs only reference this workflow.
#
# Usage in stub:
#   jobs:
#     security-scan:
#       uses: cs14lab/scan-engine/.github/workflows/reusable-scan.yml@main
#       with:
#         job_id: ${{ inputs.job_id }}
#         scanners: ${{ inputs.scanners }}
#
# Both inputs are optional. A run the customer triggers themselves (a push, a
# schedule) has neither: its job id is then `gh-<run id>`, which is the name
# the platform gives the scan it records for that run, and the default
# engines run.
#
# Engines are named ts-e1 … ts-e7 everywhere a customer can see: job names,
# result names and the summary. `scanners` takes those ids; older platform
# versions sent scanner names, which are still accepted and mapped.
#
# ts-e1 runs only TrustScan's own rules and openly licensed ones (rules/ in
# this repository). Never the Semgrep Registry (`--config auto`, `p/...`): its
# licence allows internal use only, not use as a service, paid or free.
# ts-e2 runs only when the platform asks for it: on a public repository, or a
# private one whose owner has GitHub Advanced Security (its licence's terms).

name: TrustScan Reusable Scanner

on:
  workflow_call:
    inputs:
      job_id:
        description: 'Scan job ID assigned by the TrustScan platform. Empty: gh-<run id>'
        required: false
        type: string
        default: ''
      scanners:
        description: 'Comma-separated engine ids (ts-e1 … ts-e7, dep-resolve). Empty: ts-e1,ts-e3,ts-e4'
        required: false
        type: string
        default: ''
      resolver_registry:
        description: 'Where the dependency resolver images are published (dep-resolve)'
        required: false
        type: string
        default: 'ghcr.io/cs14lab'
      resolver_tag:
        description: 'Resolver image tag (dep-resolve)'
        required: false
        type: string
        default: 'v1'   # release-pinned: scripts/release-scan-engine.sh sets the release tag
      engine_repository:
        description: 'Repository holding the rules ts-e1 runs (this one)'
        required: false
        type: string
        default: 'cs14lab/scan-engine'
      engine_ref:
        description: 'Branch or tag of engine_repository'
        required: false
        type: string
        default: 'v1'   # release-pinned: scripts/release-scan-engine.sh sets the release tag

env:
  # github.run_id is the calling workflow's run, the one the webhook reports.
  JOB_ID: ${{ inputs.job_id || format('gh-{0}', github.run_id) }}
  SCANNERS: ${{ inputs.scanners || 'ts-e1,ts-e3,ts-e4' }}
  # The public half of the key the resolver images are signed with (the image
  # build signs; see .github/workflows/aegis-resolver-image.yml in the platform
  # repository). While it is set, dep-resolve runs an image only if its
  # signature verifies, so an image pushed by anyone without the private key
  # never runs in a customer's repository. Empty: no check. Publish this file
  # only after signed images exist under the tag in use (aegis-resolver-release.yml).
  RESOLVER_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE1q+kY3tcSVOa11SBycgpYgsj1mhF
    zA4yePjcN/fZh092g29iCZszdMvjJTzQwAQBJ6hartbQYZV4yJKnDqj/8A==
    -----END PUBLIC KEY-----

jobs:
  # ── Setup: which engines run ────────────────────────
  setup:
    name: Prepare scan
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.detect.outputs.engines }}
      commit: ${{ steps.detect.outputs.commit }}
      ts_e1: ${{ steps.detect.outputs.ts_e1 }}
      ts_e2: ${{ steps.detect.outputs.ts_e2 }}
      ts_e3: ${{ steps.detect.outputs.ts_e3 }}
      ts_e4: ${{ steps.detect.outputs.ts_e4 }}
      ts_e5: ${{ steps.detect.outputs.ts_e5 }}
      ts_e6: ${{ steps.detect.outputs.ts_e6 }}
      ts_e7: ${{ steps.detect.outputs.ts_e7 }}
      dep_resolve: ${{ steps.detect.outputs.dep_resolve }}
    steps:
      - name: Choose engines
        id: detect
        run: |
          # Older platform versions send scanner names; map them to engine ids.
          declare -A ID=([semgrep]=ts-e1 [codeql]=ts-e2 [gitleaks]=ts-e3 [trivy]=ts-e4
                         [osv-scanner]=ts-e5 [osv]=ts-e5 [syft]=ts-e6 [noir]=ts-e7 [owasp-noir]=ts-e7)
          WANT=" "
          COMMIT=""
          IFS=',' read -ra TOKENS <<< "$SCANNERS"
          for t in "${TOKENS[@]}"; do
            t=$(printf '%s' "$t" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            [ -n "$t" ] || continue
            # commit=<sha>: the commit the platform pinned the scan to. Every
            # job checks it out, so a commit landing on the branch after the
            # scan started (the platform's own stub update, a push) does not
            # change what is scanned or the resolution cutoff.
            if [[ "$t" =~ ^commit=([0-9a-f]{40})$ ]]; then COMMIT=${BASH_REMATCH[1]}; continue; fi
            t=${ID[$t]:-$t}
            WANT="$WANT$t "
          done
          LIST=""
          for e in ts-e1 ts-e2 ts-e3 ts-e4 ts-e5 ts-e6 ts-e7 dep-resolve; do
            if [[ "$WANT" == *" $e "* ]]; then v=true; LIST="$LIST,$e"; else v=false; fi
            echo "${e//-/_}=$v" >> "$GITHUB_OUTPUT"
          done
          echo "engines=${LIST#,}" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Job ID: $JOB_ID"
          echo "Engines: ${LIST#,}"
          echo "Commit: ${COMMIT:-branch head}"

  # ── Dependency resolution for supply chain analysis ─
  # The repository's own runner is the build sandbox: the resolver may run the
  # project's build code here (Gradle, setup.py, source-only packages), with no
  # token and no network but the package registries (resolver/ci/run.sh, shipped
  # in the image). The platform reads dep-resolution-<job_id>.
  dep-resolve:
    name: Dependency resolution
    needs: setup
    if: needs.setup.outputs.dep_resolve == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      REG: ${{ inputs.resolver_registry }}
      TAG: ${{ inputs.resolver_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.commit }}
          path: src
          persist-credentials: false

      - name: Install signature verifier
        if: env.RESOLVER_PUBLIC_KEY != ''
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Resolve
        run: |
          [[ "$REG" =~ ^[a-z0-9./_-]+$ && "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad image reference"; exit 1; }
          if [ -n "$RESOLVER_PUBLIC_KEY" ]; then printf '%s\n' "$RESOLVER_PUBLIC_KEY" > "$RUNNER_TEMP/resolver.pub"; fi
          # Each image is pulled, pinned to the digest that was pulled, and
          # (when a key is set) verified before anything in it runs. From here
          # on only the digest is used, so the tag moving cannot swap the image.
          pinned() {
            docker pull -q "$REG/$1:$TAG" >/dev/null
            local ref
            ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$REG/$1:$TAG")
            [[ "$ref" == "$REG/$1@sha256:"* ]] || { echo "::error::no digest for $1" >&2; exit 1; }
            if [ -n "$RESOLVER_PUBLIC_KEY" ]; then
              cosign verify --key "$RUNNER_TEMP/resolver.pub" "$ref" >/dev/null 2>&1 \
                || { echo "::error::The signature of $1 could not be verified; it was not run." >&2; exit 1; }
            fi
            echo "$ref"
          }
          RESOLVER_IMAGE=$(pinned trustscan-dep-resolver)
          RESOLVER_BUILD_IMAGE=$(pinned trustscan-dep-resolver-build)
          EGRESS_IMAGE=$(pinned trustscan-resolver-egress)
          EGRESS_BUILD_IMAGE=$(pinned trustscan-resolver-egress-build)
          export RESOLVER_IMAGE RESOLVER_BUILD_IMAGE EGRESS_IMAGE EGRESS_BUILD_IMAGE
          [ -n "$RESOLVER_PUBLIC_KEY" ] && echo "Image signatures verified." || echo "Image signatures not checked (no key set)."
          docker run --rm --entrypoint cat "$RESOLVER_IMAGE" /opt/resolver/ci/run.sh > run.sh
          bash run.sh src out --build-mode

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dep-resolution-${{ env.JOB_ID }}
          path: |
            out/resolved-deps.json
            out/meta.json
          retention-days: 7

  # ── ts-e1: static code analysis ─────────────────────
  ts-e1:
    name: Static code analysis (ts-e1)
    needs: setup
    if: needs.setup.outputs.ts_e1 == 'true'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.commit }}
          path: src
          persist-credentials: false

      - name: Fetch TrustScan rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          sparse-checkout: |
            rules/semgrep
            rules/semgrep-open
          path: trustscan
          persist-credentials: false

      - name: Analyse
        run: |
          RULES="$GITHUB_WORKSPACE/trustscan/rules"
          OUT="$GITHUB_WORKSPACE/ts-e1.json"
          if [ ! -d "$RULES/semgrep" ] || [ ! -d "$RULES/semgrep-open" ]; then
            echo "::error::TrustScan's rules are missing from the engine repository"
            exit 1
          fi
          cd src
          # Generated docs and bundled third-party code are left out: on 14
          # real apps they were 245 of 1,913 findings, none in the app's code.
          if ! semgrep scan \
              --config "$RULES/semgrep" --config "$RULES/semgrep-open" \
              --dataflow-traces --metrics=off --disable-version-check \
              --exclude=docs --exclude=doc \
              --exclude='*.min.js' --exclude='*.bundle.js' \
              --exclude='**/static/**/libs/**' --exclude='**/static/**/vendor/**' \
              --exclude=vendor --exclude=third_party --exclude=node_modules \
              --json --output "$OUT" . >/dev/null 2>"$GITHUB_WORKSPACE/engine.log"; then
            echo "::warning::ts-e1 reported an error; partial results kept"
          fi
          [ -s "$OUT" ] || echo '{"results":[],"errors":[]}' > "$OUT"
          echo "ts-e1 finished"

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ts-e1-results-${{ env.JOB_ID }}
          path: ts-e1.json

  # ── ts-e3: secret detection ─────────────────────────
  ts-e3:
    name: Secret detection (ts-e3)
    needs: setup
    if: needs.setup.outputs.ts_e3 == 'true'
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.commit }}
          persist-credentials: false

      - name: Analyse
        run: |
          gitleaks detect --source=. --report-path=ts-e3.json --report-format=json --no-git \
            --exit-code 0 >/dev/null 2>&1 || true
          [ -s ts-e3.json ] || echo '[]' > ts-e3.json
          echo "ts-e3 finished"

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ts-e3-results-${{ env.JOB_ID }}
          path: ts-e3.json

  # ── ts-e4: dependency and configuration analysis ────
  ts-e4:
    name: Dependency and configuration analysis (ts-e4)
    needs: setup
    if: needs.setup.outputs.ts_e4 == 'true'
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.commit }}
          persist-credentials: false

      - name: Analyse
        run: |
          trivy fs --quiet --scanners vuln,secret,misconfig --format json --output ts-e4.json . >/dev/null 2>&1 || true
          [ -s ts-e4.json ] || echo '{"Results":[]}' > ts-e4.json
          echo "ts-e4 finished"

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ts-e4-results-${{ env.JOB_ID }}
          path: ts-e4.json

  # ── ts-e5: advisory matching ────────────────────────
  ts-e5:
    name: Advisory matching (ts-e5)
    needs: setup
    if: needs.setup.outputs.ts_e5 == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/google/osv-scanner:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.commit }}
          persist-credentials: false

      - name: Analyse
        run: |
          # JSON goes to --output, never through a shell redirect: progress
          # lines on stderr would end up inside the JSON.
          /osv-scanner --format json --output ts-e5.json -r . >/dev/null 2>&1 || true
          # The image has no jq or python: check the file starts as an object.
          if [ ! -s ts-e5.json ] || [ "$(head -c 1 ts-e5.json)" != "{" ]; then
            echo '{"results":[]}' > ts-e5.json
          fi
          echo "ts-e5 finished"

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ts-e5-results-${{ env.JOB_ID }}
          path: ts-e5.json

  # ── ts-e6: component inventory ──────────────────────
  ts-e6:
    name: Component inventory (ts-e6)
    needs: setup
    if: needs.setup.outputs.ts_e6 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.commit }}
          persist-credentials: false

      - name: Analyse
        run: |
          docker run --rm -v "$PWD:/src" anchore/syft:latest /src -q -o json > ts-e6.json 2>/dev/null || true
          [ -s ts-e6.json ] || echo '{"artifacts":[]}' > ts-e6.json
          echo "ts-e6 finished"

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ts-e6-sbom-${{ env.JOB_ID }}
          path: ts-e6.json

  # ── ts-e7: attack surface mapping ───────────────────
  ts-e7:
    name: Attack surface mapping (ts-e7)
    needs: setup
    if: needs.setup.outputs.ts_e7 == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/owasp-noir/noir:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.commit }}
          persist-credentials: false

      - name: Analyse
        run: |
          noir -b . -o ts-e7.json --format json --passive-scan >/dev/null 2>&1 || true
          [ -s ts-e7.json ] || echo '{"endpoints":[],"url":"","method":""}' > ts-e7.json
          echo "ts-e7 finished"

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ts-e7-results-${{ env.JOB_ID }}
          path: ts-e7.json

  # ── ts-e2: deep dataflow analysis ───────────────────
  # Requested by the platform only for a public repository, or a private one
  # whose owner has GitHub Advanced Security (backend core/codeql_licence.py).
  ts-e2:
    name: Deep dataflow analysis (ts-e2)
    needs: setup
    if: needs.setup.outputs.ts_e2 == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.commit }}
          persist-credentials: false

      - name: Detect languages
        id: detect-languages
        run: |
          LANGS=""
          if find . -name "*.py" -type f | head -1 | grep -q .; then LANGS="$LANGS,python"; fi
          if find . \( -name "*.js" -o -name "*.ts" \) -type f | head -1 | grep -q .; then LANGS="$LANGS,javascript"; fi
          if find . -name "*.java" -type f | head -1 | grep -q .; then LANGS="$LANGS,java"; fi
          if find . -name "*.go" -type f | head -1 | grep -q .; then LANGS="$LANGS,go"; fi
          if find . -name "*.rb" -type f | head -1 | grep -q .; then LANGS="$LANGS,ruby"; fi
          LANGS="${LANGS#,}"
          if [ -z "$LANGS" ]; then LANGS="javascript"; fi
          echo "languages=$LANGS" >> $GITHUB_OUTPUT

      - name: Prepare
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ steps.detect-languages.outputs.languages }}
        continue-on-error: true

      - name: Build
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        continue-on-error: true

      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          output: ts-e2
        continue-on-error: true

      - name: Ensure results exist
        run: |
          mkdir -p ts-e2
          if [ ! "$(ls -A ts-e2 2>/dev/null)" ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"ts-e2"}},"results":[]}]}' > ts-e2/results.sarif
          fi

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ts-e2-results-${{ env.JOB_ID }}
          path: ts-e2

  # ── Summary ─────────────────────────────────────────
  collect-results:
    name: Scan summary
    needs: [setup, ts-e1, ts-e2, ts-e3, ts-e4, ts-e5, ts-e6, ts-e7]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ./all-results
          pattern: '*-${{ env.JOB_ID }}'
          merge-multiple: false

      - name: Create summary
        env:
          ENGINES: ${{ needs.setup.outputs.engines }}
        run: |
          {
            echo "## 🔐 TrustScan Security Scan Summary"
            echo ""
            echo "**Job ID:** ${JOB_ID}"
            echo "**Engines:** ${ENGINES}"
            echo ""
            echo "### Results"
            for dir in ./all-results/*/; do
              [ -d "$dir" ] && echo "- ✅ $(basename "$dir")"
            done
            echo ""
            echo "Results are sent to TrustScan; open the scan in the dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
